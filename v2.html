<title>Atlas AINS Renewal Demo: Pulse Europe (V2)</title>
<!--
  Atlas AINS Renewal Demo: Pulse Europe
  Single self-contained file. Vanilla JS, inline CSS, hand-built SVG. No network, no build step.
  Org: Elle AI. Order: Cockpit (landing, activity, actions queue, approval, handoff), then Console.
  Deck shell matches the Gainsight x Elle AI Pulse 2026 demo. Keys: Enter/Right = next action, Left = back, PageDown/PageUp or [ ] = skip screen, N = speaker notes, M = menu, R = restart.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #181F26; background: #fff; }
  button { font-family: inherit; }
  .screen { display: none; }
  .screen.active { display: block; }
  .mono { font-family: 'Noto Sans', sans-serif; font-variant-numeric: tabular-nums; }

  /* ---------- shared pills / buttons ---------- */
  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }

  .p-amber { background: #FFF3D1; color: #9A6700; border: 1px solid #FFE18F; }
  .p-blue { background: #E6F0FD; color: #0369E9; border: 1px solid #A2C7F7; }
  .p-grey { background: #F5F7F9; color: #5F6C7A; border: 1px solid #E6E9EC; }
  .p-red { background: #FFF2F1; color: #DC3626; border: 1px solid #FCBEB9; }
  .p-purple { background: #EDE9FE; color: #5B21B6; border: 1px solid #C4B5FD; }
  .btn-p { background: #0369E9; color: #fff; padding: 7px 22px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn-p:hover { background: #034AA3; }
  .btn-p:disabled { background: #E5E7EB; color: #9CA3AF; cursor: default; }
  .btn-s { background: #fff; color: #181F26; padding: 6px 18px; border-radius: 100px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #D5D9DE; display: inline-flex; align-items: center; gap: 6px; }
  .btn-s:hover { background: #F5F7F9; }
  .btn-lnk { background: none; border: none; color: #0369E9; font-size: 13px; cursor: pointer; padding: 3px 6px; font-weight: 500; }
  .btn-lnk:hover { color: #034AA3; text-decoration: underline; }
  .sec-hdr { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: #9CA3AF; font-weight: 600; margin-bottom: 10px; }

  /* ---------- COCKPIT (Atlas 2026 designer mocks) ---------- */
  #screen-cockpit { background: #FDFDFE; min-height: 100vh; font-size: 14px; color: #181F26; }
  .ck-shell { display: flex; min-height: 100vh; }
  .ck-menu { width: 48px; background: #34383A; flex-shrink: 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 6; }
  .mi { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; position: relative; }
  .mi svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .mi.active { background: #43474A; }
  .mi.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #0369E9; }
  .mi-div { height: 1px; background: #54585A; margin: 0 12px; }
  .ck-main { flex: 1; min-width: 0; }
  .ck-hdr { height: 48px; background: #fff; display: flex; align-items: center; padding: 4px 24px 4px 32px; gap: 0; box-shadow: 0 1px 0 #EEF1F4; }
  .ck-hdr .ttl { font-size: 18px; font-weight: 600; width: 316px; }
  .ck-hdr .srch { width: 648px; max-width: 46vw; height: 32px; border-radius: 32px; background: #F5F7F9; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: #ACB4BD; font-size: 14px; }
  .ck-hdr .srch svg { width: 20px; height: 20px; stroke: #ACB4BD; fill: none; stroke-width: 1.5; stroke-linecap: round; }
  .ck-hdr .sp { flex: 1; }
  .ck-hdr .rt { display: flex; gap: 12px; align-items: center; }
  .rt .ib { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .rt .ib svg { width: 22px; height: 22px; stroke: #3C4A57; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .rt .sr { width: 24px; height: 24px; border-radius: 50%; background: #F5F7F9; font-size: 11px; color: #3C4A57; display: flex; align-items: center; justify-content: center; }
  .ck-wrap { padding: 24px 32px 90px; }
  .fpills { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fp { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 2px 8px 2px 12px; background: #fff; border: 1px solid #E6E9EC; border-radius: 100px; white-space: nowrap; }
  .fp .l { font-size: 12px; color: #5F6C7A; }
  .fp .eq { width: 16px; height: 16px; color: #5F6C7A; }
  .fp .v { font-size: 14px; }
  .fp .cv { width: 16px; height: 16px; color: #181F26; }
  .lnk12 { font-size: 12px; font-weight: 600; color: #0369E9; padding: 0 12px; cursor: default; }
  .hero { margin-top: 24px; background: linear-gradient(180deg, #E7F0FE 0%, #F7FAFF 100%); border: 1px solid #E3EDFB; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(3,105,233,.06); display: flex; flex-direction: column; gap: 24px; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; }
  .hero-org { font-size: 18px; font-weight: 600; }
  .vs { display: inline-flex; background: #fff; border-radius: 72px; padding: 2px; }
  .vs span { padding: 6px 12px; border-radius: 72px; font-size: 12px; font-weight: 600; line-height: 16px; cursor: pointer; }
  .vs span.on { background: #EBFBEE; color: #12995B; }
  .mbar { background: #fff; border: 1px solid #D2E4FB; border-radius: 12px; padding: 12px 20px; display: flex; align-items: stretch; gap: 8px; min-height: 92px; position: relative; padding-bottom: 26px; }
  .mc { padding: 10px 16px; border-radius: 10px; min-width: 120px; flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; position: relative; cursor: default; transition: background .15s; }
  .mc:hover { background: #EEF1F4; z-index: 3; }
  .mc[data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%) translateY(4px); width: 230px; background: #181F26; color: #fff; font-size: 12px; line-height: 18px; padding: 9px 12px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 10; text-align: left; font-weight: 400; }
  .mc[data-tip]:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  .mc:first-child[data-tip]::after { left: 0; transform: translateY(4px); }
  .mc:first-child[data-tip]:hover::after { transform: translateY(0); }

  /* ---------- deck shell (Gainsight x Elle Pulse 2026 style) ---------- */
  :root { --bg1: #090f23; --bg2: #1e2744; --bg3: #343553; --ink: #fff; --ink2: #ffffffad; --ink3: #ffffff6b; --line: #ffffff1f; --reskin: #5b9cff; --new: #ff6b9a; }

  .app::before { content: ""; pointer-events: none; background: radial-gradient(60% 40% at 8% 45%, #7d34be59, #0000 70%), radial-gradient(50% 35% at 95% 30%, #dc4b8c4d, #0000 70%), radial-gradient(90% 40% at 50% 110%, #be735f8c, #0000 70%); position: absolute; inset: 0; }

  if (v === 'Agent') return d === 'Agent';

  if (v === 'Awaiting') return d === 'Agent · Awaiting approval';

    <div class="cd"><h4>Contacts</h4>${o.contacts.map(c => `<div class="ov-ct">${av(c.name, 36)}<div style="flex:1;min-width:0"><b>${esc(c.name)}</b><small>${esc(c.role)}</small><span class="vc sm ${({ Responsive: 'green', 'No reply': '', Bounced: 'red' })[c.eng] || ''}" style="margin-top:4px">${esc(c.eng)}</span><div class="vact" style="margin-top:8px"><button class="vbtn sm" onclick="contactEmail('${o.id}','${esc(c.name)}')">Email</button><button class="vbtn sm t" onclick="contactCall('${o.id}','${esc(c.name)}')">Call</button></div></div></div>`).join('')}</div>
    <div class="cd"><h4>Agent</h4><div class="ov-f two">${fld('Emails sent', o.emails)}${fld('Completion', esc(o.completion))}${fld('Run started', fdate(o.startDate))}${fld('Execution ID', esc(o.agentId || ''))}</div><div class="ov-f" style="margin-top:14px">${fld('Next step', esc(o.nextStep))}</div></div></div>`;
  return `<div class="ov-wrap"><div class="ov-main"><div class="cd ov-hero">${oppCrumbs()}<div class="vh-top">${av(o.account, 64)}<div class="vh-t"><h2 style="font-size:26px;line-height:34px">${esc(o.name)}</h2><small>${esc(o.playbook)} · ${esc(o.geo)} · Salesforce ${esc(o.oppId)} · <span class="vlink" onclick="toast('Opening Salesforce is not part of this walkthrough')">View in Salesforce</span></small></div><div class="vh-a">${cta}</div></div>${metrics(o)}${path(o)}</div>
    ${pend ? `<div class="vbanner risk"><span class="bi" style="color:#C2410C">${hz('caution')}</span><div><b>Handoff pending</b><span>${esc(pend.reason)}, routed to ${esc(pend.recipient)}. Accept to take over from the agent.</span></div><span class="sp"></span><button class="vbtn p sm" onclick="acceptHandoff('${pend.id}')">Accept</button></div>` : ''}
    <div class="ov-grid2">${side}<div><div class="cd vsec vsum">${secH('automated-program', 'pu', 'Agent summary', `<span class="vlink" style="font-size:12px;text-transform:none;letter-spacing:0" onclick="askAtlas('${o.id}','Summarize the latest activity')">Ask Atlas</span>`)}<div class="vtxt">${esc(o.summary)}</div></div>
      ${timelineBlock(o)}</div></div></div>${aiPanel(o)}</div>`;
}

/* ---------- AI assistant + trace ---------- */
function aiSeeds(o) {
  if (AI_SEED[o.key]) return AI_SEED[o.key];
  const c = o.contacts[0], reply = EVENTS.filter(e => e.opp === o.id && e.src === 'GMAIL').sort((a, b) => b.ts.localeCompare(a.ts))[0];
  return [['Why did you contact ' + c.name + '?', c.name + ' (' + c.role + ') is the primary contact on the ' + o.account + ' record. I reached out under the ' + o.playbook + ' playbook after the renewal window opened (' + dueIn(o) + ' to the due date of ' + fdate(o.due) + ').'],
    ['Summarize the last reply', reply ? reply.author + ' (' + fshort(reply.ts) + '): ' + reply.body : 'There is no customer reply on ' + o.name + ' yet. ' + (o.emails ? 'I have sent ' + o.emails + ' email' + (o.emails > 1 ? 's' : '') + ' so far.' : 'No outreach has gone out yet.')],
    ['Draft a follow-up', null, { to: c.email, subject: 'Your ' + o.account + ' renewal, ' + fshort(o.due), body: 'Hi ' + c.name.split(' ')[0] + ',\n\nA quick follow-up on your ' + o.account + ' renewal on ' + fdate(o.due) + '. Your current contract is ' + amt(o, o.target) + '. If you are happy to proceed at the same terms, a short reply is all we need.\n\nBest regards,\nJames Okafor' }]];
}
function chatOf(o) { if (!S.chat[o.id]) S.chat[o.id] = [{ r: 'a', t: 'Hi ' + ME.split(' ')[0] + ', I am Atlas. Ask me about ' + o.name + '.' }]; return S.chat[o.id]; }
function aiPanel(o) {
  const msgs = chatOf(o), seeds = aiSeeds(o), trace = TRACE.filter(t => t.opp === o.id).sort((a, b) => a.ts.localeCompare(b.ts) || a.id.localeCompare(b.id));
  const body = S.ai === 'chat'
    ? msgs.map((m, i) => `<div class="vmsg ${m.r === 'u' ? 'me' : ''}"><div class="vbub">${esc(m.t)}${m.draft ? `<div class="vdraft"><div class="h">Email draft</div><div class="c"><b>To:</b> ${esc(m.draft.to)}\n<b>Subject:</b> ${esc(m.draft.subject)}\n\n${esc(m.draft.body)}</div><div class="f"><button class="vbtn p sm" onclick="useDraft(${i})">Use draft</button><button class="vbtn sm" onclick="editDraft(${i})">Edit</button></div></div>` : ''}</div></div>`).join('') + `<div class="vmut" style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:6px">Suggested</div><div class="vsug">${seeds.map((s, i) => `<button onclick="aiAsk(${i})">${esc(s[0])}</button>`).join('')}</div>`
    : `<div class="vmut" style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px">Atlas activity on this opportunity</div>` + trace.map(t => `<div class="vtr ${t.kind} ${S.hl === t.id ? 'hl open' : ''}" data-trid="${t.id}"><i></i><div class="tt" onclick="this.parentNode.classList.toggle('open')"><small>${({ think: 'Thinking', tool: 'Action', email: 'Email', wait: 'Wait' })[t.kind]}</small>${esc(t.title)}</div><div class="tm">${fdt(t.ts)}</div>${t.detail ? `<div class="td">${esc(t.detail)}</div>` : ''}</div>`).join('');
  return `<div class="cd vai"><div class="vai-h"><span class="lg">${hz('bolt')}</span><b>Atlas</b><div class="vtoggle"><span class="${S.ai === 'chat' ? 'on' : ''}" onclick="setAi('chat')">Chat</span><span class="${S.ai === 'trace' ? 'on' : ''}" onclick="setAi('trace')">Trace</span></div></div><div class="vai-b" id="aib">${body}</div>${S.ai === 'chat' ? `<div class="vai-i"><input id="aiq" placeholder="Ask Atlas about this renewal" onkeydown="if(event.key==='Enter')aiSend()"><button class="vbtn p sm" onclick="aiSend()">Send</button></div>` : ''}</div>`;
}
const curOpp = () => S.opp;
function setAi(m) { S.ai = m; S.hl = null; renderAll(); }
function pushAsk(oid, text) {
  const o = OPP(oid), m = chatOf(o), seeds = aiSeeds(o), t = text.toLowerCase(); m.push({ r: 'u', t: text });
  let hit = seeds.find(s => s[0].toLowerCase() === t);
  if (!hit && /help me with this step/.test(t)) { const d = seeds.find(s => s[2]); m.push({ r: 'a', t: 'Here is how I would approach this step.\n\n- Start from the latest customer message on the timeline.\n- Keep it short and ask one clear question.\n- I drafted a note you can use or edit.', draft: d ? d[2] : null }); renderAll(); const b = $('.vai-b'); if (b) b.scrollTop = b.scrollHeight; return; }
  if (!hit) hit = /draft|write|reply|email|note/.test(t) ? seeds.find(s => s[2]) : /summar|last|said|replied|activity/.test(t) ? seeds.find(s => /summar/i.test(s[0])) : /why|contact|handed|routed|flag/.test(t) ? seeds[0] : null;
  if (!hit) m.push({ r: 'a', t: 'I can explain why I contacted someone on ' + o.account + ', summarize the latest reply, or draft an email. Try one of the suggestions below.' });
  else m.push(hit[2] ? { r: 'a', t: 'Here is a draft you can use or edit.', draft: hit[2] } : { r: 'a', t: hit[1] });
  renderAll(); const b = $('.vai-b'); if (b) b.scrollTop = b.scrollHeight;
}
function askAtlas(oid, text) { if (S.tab !== 'opp' || S.opp !== oid) { S.from = S.tab === 'opp' ? S.from : S.tab; S.opp = oid; S.tab = 'opp'; S.otab = 'timeline'; S.addAct = null; S.resch = false; } S.ai = 'chat'; $('#scroller').scrollTop = 0; pushAsk(oid, text); }
function aiAsk(i) { const id = curOpp(); pushAsk(id, aiSeeds(OPP(id))[i][0]); }
function aiSend() { const i = $('#aiq'); if (!i || !i.value.trim()) return; pushAsk(curOpp(), i.value.trim()); }
function useDraft(i) { const o = OPP(curOpp()), d = chatOf(o)[i].draft; ev(o.id, nowTs(), 'email', 'MANUAL', d.subject, d.body, ME, { to: d.to }); renderAll(); toast('Draft saved to the timeline. It will go out when you approve it.'); }
function editDraft(i) { const o = OPP(curOpp()), d = chatOf(o)[i].draft; if (S.tab !== 'opp' || S.opp !== o.id) openOpp(o.id, S.tab); S.addAct = { type: 'email', subject: d.subject, to: d.to, body: d.body }; S.otab = 'timeline'; renderAll(); setTimeout(() => { const a = $('#actBody'); if (a) a.scrollIntoView({ block: 'center' }); }, 50); }

/* ---------- boot ---------- */
document.querySelectorAll('[data-hz]').forEach(el => { el.outerHTML = hz(el.dataset.hz); });
renderAll();

/* Right arrow switches from the Cockpit to the Console (Left arrow switches back) */
document.addEventListener('keydown', e => {
  if (document.getElementById('intro') && (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hideIntro(); return; }
  if (e.key !== 'ArrowRight' || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const el = document.activeElement, t = el && el.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || (el && el.isContentEditable)) return;
  if (document.getElementById('vmod') || document.querySelector('.hzs.open')) return;
  location.href = 'index.html';
});

/* ---------- intro splash: glowing stars background (modeled on the EmailMonkey Pulse intro) ---------- */
(function () {
  if (location.hash === '#app') return;
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const stars = Array.from({ length: 70 }, (_, i) => { const s = 1 + Math.floor(rnd() * 3) * 0.5; return `<i style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 78).toFixed(1)}%;width:${s}px;height:${s}px;animation:inStar${1 + i % 3} ${(2.6 + rnd() * 2).toFixed(2)}s ease-in-out ${Math.round(rnd() * 3000)}ms infinite"></i>`; }).join('');
  const sparkles = Array.from({ length: 9 }, (_, i) => { const z = 16 + Math.round(rnd() * 14); return `<b class="in-sp" style="left:${(6 + rnd() * 88).toFixed(1)}%;top:${(4 + rnd() * 44).toFixed(1)}%;width:${z}px;height:${z}px;animation-delay:${i * 700}ms"><u></u><u></u><u></u></b>`; }).join('');
  const el = document.createElement('div'); el.id = 'intro';
  el.innerHTML = `<div class="in-bg"></div>
    <svg class="in-neb" viewBox="0 0 100 56.25" preserveAspectRatio="none"><defs><filter id="inbl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5.5"/></filter><filter id="inbr" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4.5"/></filter><linearGradient id="inviolet" x1="0%" y1="22%" x2="0%" y2="46%" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(85,55,200,.62)"/><stop offset="50%" stop-color="rgba(125,52,190,.66)"/><stop offset="100%" stop-color="rgba(155,55,178,.2)"/></linearGradient><linearGradient id="inrose" x1="100%" y1="20%" x2="70%" y2="32%" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(220,75,140,.7)"/><stop offset="100%" stop-color="rgba(178,55,155,.38)"/></linearGradient></defs><path d="M 0 32 Q 18 22 32 30 Q 18 38 0 46" stroke="url(#inviolet)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#inbl)"/><path d="M 100 20 Q 82 31 68 24 Q 82 17 100 34" stroke="url(#inrose)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#inbr)"/></svg>
    <div class="in-glow"></div><div class="in-stars">${stars}${sparkles}</div><div class="in-shoot" id="inShoot"></div>
    <div class="in-c"><div class="in-lg">${hz('bolt')}</div><h1>Atlas</h1><p>Renewals as a service for Elle AI</p><div class="in-s"><span>Cockpit</span><i></i><span>Console</span></div></div>
    <div class="in-hint">Press <b>→</b> to begin</div>`;
  document.body.appendChild(el);
  const shoot = () => { const host = document.getElementById('inShoot'); if (!host) return; const s = document.createElement('span'); s.style.cssText = `left:${10 + rnd() * 60}%;top:${4 + rnd() * 28}%;--ss-angle:${(20 + rnd() * 20).toFixed(0)}deg;--ss-dist:${(240 + rnd() * 200).toFixed(0)}px`; host.appendChild(s); setTimeout(() => s.remove(), 2400); setTimeout(shoot, 5000 + rnd() * 5000); };
  setTimeout(shoot, 2500);
  window.hideIntro = () => { const e = document.getElementById('intro'); if (!e) return; try { history.replaceState(null, '', '#app'); } catch (e) {} e.classList.add('out'); setTimeout(() => e.remove(), 600); };
  el.onclick = hideIntro;
})();


(function () { const i = document.querySelector('.hd-me .hd-ph'); if (i) { i.style.backgroundImage = 'url(' + DEMO_USER.photo + ')'; } const m = document.querySelector('.hd-me'); if (m) m.title = DEMO_USER.name + ', ' + DEMO_USER.role; })();
HDR.init({
  user: DEMO_USER, toast: m => toast(m), home: () => go('queue'),
  pending: () => QUEUE.filter(q => q.status === 'Awaiting').map(q => ({ t: qOpp(q).account, s: q.type + ' · ' + q.reason + ' · Due ' + fshort(q.due), go: () => openQueue(q.id) })),
  search: v => OPPS.filter(o => o.account.toLowerCase().includes(v.toLowerCase())).slice(0, 8).map(o => ({ t: o.account, s: o.stage + ' · ' + amt(o, o.target) + ' · ' + driverOf(o), go: () => openOpp(o.id, S.tab === 'opp' ? S.from : S.tab) })),
  suggest: ['What needs my attention today?', 'Which renewals are at risk?', 'How is the agent doing?'],
  ask: t => {
    t = t.toLowerCase(); const aw = QUEUE.filter(q => q.status === 'Awaiting'), ap = aw.filter(q => q.type === 'Approval').length;
    if (/attention|today|waiting|queue|approve|review/.test(t)) return aw.length ? 'You have ' + aw.length + ' items waiting: ' + ap + ' approvals and ' + (aw.length - ap) + ' handoffs.\n\nFirst up: ' + aw.slice(0, 3).map(q => qOpp(q).account + ' (' + q.type.toLowerCase() + ', due ' + fshort(q.due) + ')').join(', ') + '.' : 'Nothing is waiting on you. Your queue is empty.';
    if (/risk|churn|health/.test(t)) { const r = OPPS.filter(o => o.res === 'Open' && o.health < 50).sort((a, b) => a.health - b.health).slice(0, 4); return r.length + ' open renewals have a health score below 50:\n' + r.map(o => '- ' + o.account + ' (health ' + o.health + ', ' + amt(o, o.target) + ', ' + dueIn(o) + ')').join('\n'); }
    if (/agent|autonomy|doing|perform/.test(t)) return 'Autonomy rate is ' + METRICS.autonomy + '%, up 29 pts since launch. The agent is handling ' + METRICS.handling + ' renewals end to end and ' + METRICS.rmq + ' are with renewal managers.';
    if (/won|closed|renewed/.test(t)) { const w = OPPS.filter(o => o.res === 'Won'); return w.length + ' renewals are closed won in this view, worth ' + money('€', w.reduce((a, o) => a + (o.final || 0), 0)) + '.'; }
    return 'I can tell you what needs your attention, which renewals are at risk, or how the agent is doing. Try one of the suggestions.';
  }
});

</script>
